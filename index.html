<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smash a Frog</title>
    <meta
      name="description"
      content="Tap the smash button to summon falling anvils that crash down across the stump. Each impact makes the frog hop in panic, shout random phrases, and try to survive the never‑ending barrage. "
    />
    <link rel="icon" href="./images/icons/frog.png" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="gameHeader">
      <h1>Welcome to Smash a Frog</h1>
    </header>
    <main id="game">
      <canvas id="gameCanvas"> </canvas>
      <button id="fullScreenEnter" class="fullScreenEnter">
        <svg
          version="1.1"
          id="Layer_1"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          viewBox="0 0 512 512"
          xml:space="preserve"
          fill="#000000"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
          <g id="SVGRepo_iconCarrier">
            <circle style="fill: #2f902f" cx="256" cy="256" r="256"></circle>
            <path
              style="fill: #c2ab7b"
              d="M256,489.296C127.36,489.296,22.704,384.64,22.704,256C22.704,127.352,127.36,22.696,256,22.696 c128.648,0,233.304,104.656,233.304,233.304C489.304,384.64,384.648,489.296,256,489.296z M256,30.696 C131.768,30.696,30.704,131.768,30.704,256c0,124.224,101.072,225.296,225.296,225.296c124.232,0,225.304-101.072,225.304-225.296 C481.304,131.768,380.232,30.696,256,30.696z"
            ></path>
            <path
              style="fill: #dcf8d1"
              d="M156.64,387.712V124.288l246.72,131.72L156.64,387.712z"
            ></path>
          </g>
        </svg>
      </button>
      <button id="fullScreenExit" class="fullScreenExit" hidden>EXIT</button>
      <button id="smash" class="smash" hidden></button>
    </main>
    <footer id="gameFooter">
      <p>
        Tap the smash button to summon falling anvils that crash down across the
        stump. Each impact makes the frog hop in panic, shout random phrases,
        and try to survive the never‑ending barrage.
      </p>
    </footer>
    <script src="game.js"></script>
  </body>
</html>
